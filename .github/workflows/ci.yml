name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgl1-mesa-dev libglfw3-dev libglew-dev libglm-dev libfreetype-dev libsoil-dev
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel 2
